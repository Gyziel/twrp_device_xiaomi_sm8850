name: Build TWRP 16 - Xiaomi 17 Pro (UNTESTED)

on:
  workflow_dispatch:
  push:
    branches:
      - twrp-16.0
    paths:
      - '.github/workflows/build.yml'
      - 'BoardConfig.mk'
      - 'AndroidProducts.mk'
      - 'twrp_sm8850.mk'
      - 'device.mk'
      - 'recovery.fstab'
      - 'prebuilt/**'
      - 'recovery/**'
      - 'security/**'

permissions:
  contents: read

concurrency:
  group: twrp-sm8850-build
  cancel-in-progress: false

jobs:
  build:
    name: TWRP 16 / sm8850 / pandora candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      ALLOW_MISSING_DEPENDENCIES: 'true'
      DEVICE_PATH: device/xiaomi/sm8850
      DEVICE_NAME: sm8850
      BRANCH_NAME: twrp-16.0
      TWRP_MANIFEST: https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git
    steps:
      - name: Verify build target
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH_NAME"
          test "$GITHUB_REPOSITORY" = "Gyziel/twrp_device_xiaomi_sm8850"
          echo "Building $GITHUB_REPOSITORY at $GITHUB_SHA"
          echo "WARNING: Android 16 recovery source has not been tested on HyperOS 4 / Android 17."
          df -h .

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y repo git git-lfs curl zip unzip lz4 zstd bc bison flex ccache
          git config --global user.name 'Gyziel TWRP Builder'
          git config --global user.email 'actions@users.noreply.github.com'
          df -h .

      - name: Sync TWRP 16 source
        run: |
          set -euo pipefail
          repo init --depth=1 -u "$TWRP_MANIFEST" -b "$BRANCH_NAME"
          repo sync -c --no-tags --no-clone-bundle --fail-fast -j4
          df -h .

      - name: Use this fork and exact commit
        run: |
          set -euo pipefail
          mkdir -p device/xiaomi
          git clone --depth=1 --single-branch -b "$BRANCH_NAME"             "https://github.com/$GITHUB_REPOSITORY.git" "$DEVICE_PATH"
          cd "$DEVICE_PATH"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          test -s prebuilt/kernel
          test -f BoardConfig.mk
          test -f twrp_sm8850.mk
          grep -q 'PRODUCT_NAME := twrp_sm8850' twrp_sm8850.mk
          grep -q 'BOARD_EXCLUDE_KERNEL_FROM_RECOVERY_IMAGE := true' BoardConfig.mk
          echo "WARNING: SM8850 shared device tree, not a verified pandora-specific recovery."

      - name: Build recovery image
        run: |
          set -euo pipefail
          export USE_CCACHE=1
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_EXEC="$(command -v ccache)"
          ccache -M 5G
          source build/envsetup.sh
          lunch twrp_sm8850
          m -j2 recoveryimage

      - name: Check and package output
        run: |
          set -euo pipefail
          IMAGE="out/target/product/$DEVICE_NAME/recovery.img"
          test -s "$IMAGE" || { echo "Missing or empty recovery.img"; exit 1; }
          mkdir -p twrp-artifact
          cp "$IMAGE" twrp-artifact/TWRP-16-sm8850-UNTESTED.img
          (cd twrp-artifact && sha256sum TWRP-16-sm8850-UNTESTED.img > SHA256SUMS.txt)
          {
            echo "Requested device: Xiaomi 17 Pro (pandora)"
            echo "Build target: twrp_sm8850 (shared Xiaomi SM8850 tree)"
            echo "Manifest: $TWRP_MANIFEST ($BRANCH_NAME, Android 16)"
            echo "Device tree: https://github.com/$GITHUB_REPOSITORY"
            echo "Source commit: $GITHUB_SHA"
            echo "Actions run: $GITHUB_RUN_ID"
            echo "UNTESTED on HyperOS 4 / Android 17. Do not flash without device-specific verification."
          } > twrp-artifact/BUILD-INFO.txt
          cat twrp-artifact/BUILD-INFO.txt
          cat twrp-artifact/SHA256SUMS.txt

      - name: Upload test artifact (not a Release)
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-16-sm8850-UNTESTED
          path: twrp-artifact/
          if-no-files-found: error
          retention-days: 14

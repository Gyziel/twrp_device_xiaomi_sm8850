name: TWRP Xiaomi 17 Pro - CI verification and recovery build

on:
  workflow_dispatch:
  push:
    branches:
      - twrp-16.0
    paths:
      - '.github/workflows/diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    name: Check Actions runner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify GitHub Actions
        run: |
          set -e
          echo "GitHub Actions runner is working."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          test "$GITHUB_REF_NAME" = "twrp-16.0"

  build:
    name: Build sm8850 TWRP recovery (UNTESTED on pandora)
    needs: diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    env:
      ALLOW_MISSING_DEPENDENCIES: 'true'
      DEVICE_PATH: device/xiaomi/sm8850
      TWRP_BRANCH: twrp-16.0
    steps:
      - name: Inspect runner
        run: |
          set -euo pipefail
          echo "Source commit: $GITHUB_SHA"
          df -h .

      - name: Free up build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y repo git git-lfs zip unzip lz4 zstd bc bison flex ccache
          git config --global user.name 'Gyziel TWRP Builder'
          git config --global user.email 'actions@users.noreply.github.com'
          df -h .

      - name: Download TWRP source
        run: |
          set -euo pipefail
          repo init --depth=1 -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git -b "$TWRP_BRANCH"
          repo sync -c -j4 --no-tags --no-clone-bundle --fail-fast
          df -h .

      - name: Clone this device tree from this fork
        run: |
          set -euo pipefail
          mkdir -p device/xiaomi
          git clone --depth=1 --single-branch -b "$TWRP_BRANCH" "https://github.com/$GITHUB_REPOSITORY.git" "$DEVICE_PATH"
          cd "$DEVICE_PATH"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          test -s prebuilt/kernel
          test -f BoardConfig.mk
          grep -q 'PRODUCT_NAME := twrp_sm8850' twrp_sm8850.mk
          grep -q 'BOARD_EXCLUDE_KERNEL_FROM_RECOVERY_IMAGE := true' BoardConfig.mk
          echo "Shared SM8850 tree includes pandora in README, but is not validated for Android 17."

      - name: Compile recovery.img with resource watchdog
        run: |
          set -uo pipefail
          echo "Build start $(date -u -Is)"
          df -h .
          free -h
          swapon --show
          {
            echo "Build on $GITHUB_REPOSITORY at commit $GITHUB_SHA"
            echo "This log is preserved separately to keep the Actions live log small."
          } > "$GITHUB_WORKSPACE/build.log"
          echo "Resource telemetry $(date -u -Is)" > "$GITHUB_WORKSPACE/resource.log"
          export USE_CCACHE=1
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_EXEC="$(command -v ccache)"
          ccache -M 5G
          # A separate session permits terminating the compiler cleanly if the
          # runner approaches disk or memory exhaustion.
          setsid bash -c '
            set -eo pipefail
            source build/envsetup.sh
            lunch twrp_sm8850
            m -j1 recoveryimage
          ' >> "$GITHUB_WORKSPACE/build.log" 2>&1 &
          build_pid=$!
          resource_abort=0
          while kill -0 "$build_pid" 2>/dev/null; do
            echo "==== $(date -u -Is) ====" | tee -a "$GITHUB_WORKSPACE/resource.log"
            df -h . | tee -a "$GITHUB_WORKSPACE/resource.log"
            free -m | tee -a "$GITHUB_WORKSPACE/resource.log"
            disk_kb=$(df -Pk . | awk 'NR==2 {print $4}')
            mem_kb=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
            swap_kb=$(awk '/^SwapFree:/ {print $2}' /proc/meminfo)
            if [ "$disk_kb" -lt 3145728 ]; then
              echo "::error::Disk free below 3 GiB during compilation; stopping before the runner fails." | tee -a "$GITHUB_WORKSPACE/resource.log"
              resource_abort=1
              break
            fi
            if [ "$mem_kb" -lt 786432 ] && [ "$swap_kb" -lt 524288 ]; then
              echo "::error::Available RAM below 768 MiB and free swap below 512 MiB; stopping before OOM." | tee -a "$GITHUB_WORKSPACE/resource.log"
              resource_abort=1
              break
            fi
            sleep 60
          done
          if [ "$resource_abort" -ne 0 ]; then
            kill -TERM -- "-$build_pid" 2>/dev/null || true
            sleep 5
            kill -KILL -- "-$build_pid" 2>/dev/null || true
          fi
          wait "$build_pid"
          code=$?
          if [ "$resource_abort" -ne 0 ] && [ "$code" -eq 0 ]; then code=1; fi
          echo "Compiler exit status: $code"
          echo "Last 140 lines of compiler output:"
          tail -n 140 "$GITHUB_WORKSPACE/build.log" || true
          echo "Final resource snapshot:"
          df -h .
          free -m
          if [ "$code" -ne 0 ]; then
            echo "::error::recoveryimage failed, exit code $code; inspect TWRP-build-diagnostics artifact"
          fi
          exit "$code"

      - name: Upload compiler and resource logs (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            resource.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify and label artifact
        run: |
          set -euo pipefail
          IMAGE=out/target/product/sm8850/recovery.img
          test -s "$IMAGE"
          SIZE=$(stat -c%s "$IMAGE")
          test "$SIZE" -le 104857600 || { echo "Recovery image exceeds configured 100 MiB partition size"; exit 1; }
          mkdir -p twrp-artifact
          cp "$IMAGE" twrp-artifact/TWRP-16-sm8850-UNTESTED.img
          (
            cd twrp-artifact
            sha256sum TWRP-16-sm8850-UNTESTED.img > SHA256SUMS.txt
          )
          {
            echo "Xiaomi 17 Pro (pandora), shared sm8850 tree"
            echo "TWRP branch: twrp-16.0"
            echo "Source commit: $GITHUB_SHA"
            echo "WARNING: Not verified on HyperOS 4 / Android 17. Do not flash before device-specific review."
          } > twrp-artifact/BUILD-INFO.txt

      - name: Upload untested image as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-16-sm8850-UNTESTED
          path: twrp-artifact/
          if-no-files-found: error
          retention-days: 14

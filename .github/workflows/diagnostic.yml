name: TWRP Actions Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [twrp-16.0]
    paths:
      - .github/workflows/diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify GitHub Actions
        run: |
          echo "Actions workflow is enabled."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "SHA: $GITHUB_SHA"
